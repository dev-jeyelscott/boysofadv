name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: boysofadv_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d boysofadv_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/boysofadv_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/boysofadv_test
      ATTENDANCE_TOKEN_SECRET: test-attendance-secret
      AUTH_SECRET: test-auth-secret

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec drizzle-kit push

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test -- --run

      - run: pnpm test:integration

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e
